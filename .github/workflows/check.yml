name: check

on:
  pull_request:
    # `edited` re-checks a retitled PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just
      - run: just rust

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,cargo-deny
      - run: just deny

  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just,typos,zizmor
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Commit range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$PUSH_BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "COMMIT_RANGE=$range" >> "$GITHUB_ENV"
      - run: just meta "$COMMIT_RANGE"
        env:
          GH_TOKEN: ${{ github.token }}

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: just
      - run: just pr-title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  # The one status the ruleset on main requires. `pr-title` only runs on pull requests, so a
  # skipped `pr-title` passes; every other job must succeed.
  check:
    if: always()
    needs: [rust, deny, meta, pr-title]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.rust.result }} ${{ needs.deny.result }} ${{ needs.meta.result }}
          PR_TITLE_RESULT: ${{ needs.pr-title.result }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job ended: $r"; exit 1; }
          done
          case "$PR_TITLE_RESULT" in
            success|skipped) ;;
            *) echo "pr-title ended: $PR_TITLE_RESULT"; exit 1 ;;
          esac

# cargo-deny: advisories, bans, licenses and sources. https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
# Zlib: foldhash, which ratatui's layout solver reaches through hashbrown (ADR 0012, #174).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

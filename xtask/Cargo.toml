[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
# Both already built for orca-term itself: the live checks read orca-term's JSON and the recorded
# payloads, and attach to the agent on a pseudo-terminal.
pty-process = "0.5.3"
serde_json = "1.0.151"

[dev-dependencies]
# Already in the lock through assert_fs: the live checks' end-to-end test works in temporary
# directories.
tempfile = { version = "3.27.0", default-features = false }

[lints]
workspace = true

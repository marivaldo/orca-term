# typos: https://github.com/crate-ci/typos

[files]
# The map's original input, kept verbatim in Portuguese, and what the agents sent, recorded
# verbatim with their random ids (#44).
extend-exclude = [
  "docs/wayfinder-input.md",
  "tests/fixtures/claude-hooks/",
  "tests/fixtures/opencode-events/",
  # The application's screens as drawn (#174): words cut wherever a column ends (`stopp…`), and
  # grids of one letter per cell.
  "src/app/snapshots/",
]

[default.extend-words]
# Neovim's `:enew` command (edit a new, empty buffer).
enew = "enew"
# ratatui, the terminal drawing library the application is built on (ADR 0012).
ratatui = "ratatui"
